name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: "Release label for artifact naming"
        required: false
        default: "snapshot"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.4" "ndk;26.3.11579264"

      - name: Grant Gradle Execute Permission
        run: chmod +x ./gradlew

      - name: Prepare Release Signing
        run: |
          echo "${{ secrets.INTELLIGENCE_LAB_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/intelligence-lab-release.jks"
          test -s "$RUNNER_TEMP/intelligence-lab-release.jks"

      - name: Build Release APK
        env:
          INTELLIGENCE_LAB_KEYSTORE_PATH: ${{ runner.temp }}/intelligence-lab-release.jks
          INTELLIGENCE_LAB_KEYSTORE_PASSWORD: ${{ secrets.INTELLIGENCE_LAB_KEYSTORE_PASSWORD }}
          INTELLIGENCE_LAB_KEY_ALIAS: ${{ secrets.INTELLIGENCE_LAB_KEY_ALIAS }}
          INTELLIGENCE_LAB_KEY_PASSWORD: ${{ secrets.INTELLIGENCE_LAB_KEY_PASSWORD }}
        run: |
          mkdir -p out
          while true; do
            echo "Release build still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 60
          done &
          HEARTBEAT_PID=$!
          trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease -x lintVitalAnalyzeRelease 2>&1 | tee out/gradle-release-build.log

      - name: Collect Build Outputs
        run: |
          mkdir -p out
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          APK_NAME="IntelligenceLab-${{ github.event.inputs.release_label || 'snapshot' }}-${{ github.run_number }}.apk"
          cp "$APK_SRC" "out/$APK_NAME"
          sha256sum "out/$APK_NAME" | tee out/SHA256SUMS.txt
          ls -la out

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IntelligenceLab-${{ github.event.inputs.release_label || 'snapshot' }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IntelligenceLab-build-logs-${{ github.run_number }}
          path: out/gradle-release-build.log
          if-no-files-found: ignore
